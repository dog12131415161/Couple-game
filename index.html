<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夫妻默契挑戰</title>
<style>
:root{--bg:#f7f2ee;--card:#fff;--text:#2c2724;--muted:#7b736e;--accent:#d96f61;--accent2:#f7d9d3;--border:#e8ddd6;--panel:#fbf7f4;--ok:#e7f7eb;--bad:#fff0ee}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1080px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.04)}
.hidden{display:none!important}.center{text-align:center}.muted{color:var(--muted)}
h1,h2,h3{margin-top:0}
button{font:inherit;cursor:pointer}.btn{min-height:44px;border-radius:12px;padding:10px 16px;font-weight:800;border:1px solid var(--border);background:#fff}.btn.primary{background:var(--accent2);border-color:transparent}.btn:disabled{opacity:.4;cursor:not-allowed}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:62px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:14px;text-align:left;font-weight:700}
.choice:hover{background:var(--panel)}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-weight:700;background:#fff}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.role{padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--panel);font-size:20px;font-weight:800}
.stage{margin-top:16px}
.status{padding:12px;border-radius:14px;background:var(--panel);text-align:center;font-weight:700;margin-top:14px}
.resultbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.answerbox{border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.ladder-layout{display:grid;grid-template-columns:200px 1fr;gap:16px}
#ladder{display:flex;flex-direction:column-reverse;gap:8px}
.step{border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;justify-content:space-between;font-size:14px}
.step.active{outline:2px solid var(--accent);background:var(--accent2);font-weight:800}.step.passed{opacity:.55}
#bag{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.cardback{min-width:48px;min-height:58px;border:1px solid var(--border);border-radius:12px;background:var(--panel);font-size:23px}
.revive{display:none;background:var(--bad);border:1px solid #efc4bc;border-radius:16px;padding:16px;text-align:center;margin-top:14px}.revive.show{display:block}
.card-result{display:none;margin-top:12px;background:var(--panel);border-radius:14px;padding:14px;text-align:center}.card-result.show{display:block}
.money{font-size:18px;font-weight:900}
@media(max-width:760px){.roles,.choice-grid,.resultbox,.ladder-layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <section id="landing" class="card center">
    <h1>💞 夫妻默契挑戰</h1>
    <p class="muted">先測默契，賺錦囊；再進入獎金闖關。</p>
    <div class="roles">
      <button class="role" onclick="selectRole('husband')">👨 我是老公</button>
      <button class="role" onclick="selectRole('wife')">👩 我是老婆</button>
    </div>
  </section>

  <section id="stage1" class="card hidden stage">
    <div class="topline">
      <div><strong>第一階段｜夫妻默契大考驗</strong><div class="muted" id="roleText"></div></div>
      <div class="pill">目前分數：<span id="syncScore">0</span></div>
    </div>
    <div class="muted" id="syncNum"></div>
    <h2 id="syncQuestion"></h2>
    <div id="syncOptions" class="choice-grid"></div>
    <div id="syncStatus" class="status">請選一個答案。</div>
    <div id="syncReveal" class="resultbox hidden">
      <div class="answerbox">👨 老公答案<br><strong id="husbandAns">—</strong></div>
      <div class="answerbox">👩 老婆答案<br><strong id="wifeAns">—</strong></div>
    </div>
    <div class="center" style="margin-top:14px">
      <button id="syncNext" class="btn primary hidden">下一題</button>
    </div>
  </section>

  <section id="stage1End" class="card hidden stage center">
    <h2>🎉 第一階段完成</h2>
    <div style="font-size:48px;font-weight:900"><span id="finalSyncScore">0</span> 分</div>
    <p>你們獲得 <strong>🃏 × <span id="lifelinesEarned">0</span></strong></p>
    <button class="btn primary" id="goStage2">進入第二階段 🔥</button>
  </section>

  <section id="stage2" class="hidden stage">
    <div class="topline">
      <div><strong>第二階段｜夫妻獎金闖關</strong></div>
      <div class="pill money">🧧 目前保有：<span id="currentMoney">$0</span></div>
    </div>
    <div class="ladder-layout">
      <aside class="card">
        <h3>💰 獎金階梯</h3>
        <div class="muted" style="font-size:12px;margin-bottom:10px">答對一題就往上爬</div>
        <div id="ladder"></div>
      </aside>
      <main class="card">
        <div class="topline">
          <span id="qnum" class="muted"></span>
          <span class="pill" id="questionMoney"></span>
        </div>
        <h2 id="moneyQuestion"></h2>
        <div id="moneyOptions" class="choice-grid"></div>
        <div id="feedback" class="status">你們可以直接作答，或放棄並帶走目前獎金。</div>

        <div id="reviveBox" class="revive">
          <h3>💥 答錯了！</h3>
          <div id="reviveText"></div>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">
            <button class="btn primary" id="reviveBtn">支付 3 張錦囊復活 ❤️‍🔥</button>
            <button class="btn" id="failBtn">不復活</button>
          </div>
        </div>

        <div style="border-top:1px solid var(--border);margin-top:18px;padding-top:16px">
          <div class="topline">
            <div><strong>🎒 錦囊</strong><div class="muted" style="font-size:13px">大部分很廢，但也可能救命。</div></div>
            <strong>剩餘 <span id="bagCount">0</span> 張</strong>
          </div>
          <div id="bag"></div>
          <div id="cardResult" class="card-result">
            <div id="cardName" style="font-weight:800;font-size:18px"></div>
            <div id="cardEffect"></div>
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
          <button class="btn" id="quitBtn">💼 放棄，拿走獎金</button>
          <button class="btn primary" id="nextMoneyBtn" disabled>下一題</button>
        </div>
      </main>
    </div>
  </section>

  <section id="finalScreen" class="card hidden stage center">
    <div id="finalIcon" style="font-size:48px">🏆</div>
    <h2 id="finalTitle">挑戰結束</h2>
    <div class="muted">你們最後帶走</div>
    <div id="finalMoney" style="font-size:54px;font-weight:900">$0</div>
    <div id="finalText" class="muted"></div>
    <button class="btn primary" onclick="location.reload()" style="margin-top:16px">重新開始</button>
  </section>
</div>

<script>
let role='';
const syncQuestions=[
{q:'如果突然多出一天假，你最想做什麼？',opts:['在家耍廢','去吃好料','開車出去玩','睡到自然醒']},
{q:'如果今天晚上只能選一個，你比較想？',opts:['看電影','打遊戲','吃宵夜','散步聊天']},
{q:'兩個人臨時決定出門，你比較偏向？',opts:['百貨公司','咖啡廳','山上看夜景','直接回家']},
{q:'紀念日你比較重視哪一種？',opts:['禮物','大餐','旅行','一起待著']},
{q:'如果中了一筆小獎金，第一個想法是？',opts:['存起來','買東西','吃好料','出去玩']}
];
let syncIndex=0,syncScore=0;
function selectRole(r){
 role=r;document.getElementById('landing').classList.add('hidden');document.getElementById('stage1').classList.remove('hidden');
 document.getElementById('roleText').textContent=r==='husband'?'你目前選擇：老公 👨':'你目前選擇：老婆 👩';
 renderSync();
}
function renderSync(){
 const q=syncQuestions[syncIndex];
 document.getElementById('syncNum').textContent='第 '+(syncIndex+1)+' 題 / '+syncQuestions.length;
 document.getElementById('syncQuestion').textContent=q.q;
 const box=document.getElementById('syncOptions');box.innerHTML='';
 document.getElementById('syncReveal').classList.add('hidden');document.getElementById('syncNext').classList.add('hidden');
 document.getElementById('syncStatus').textContent='Demo 模式：選你的答案後，系統會模擬另一半的答案。';
 q.opts.forEach((t,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'｜'+t;b.onclick=()=>answerSync(i);box.appendChild(b)})
}
function answerSync(i){
 const q=syncQuestions[syncIndex];[...document.getElementById('syncOptions').children].forEach(b=>b.disabled=true);
 const other=Math.floor(Math.random()*4);
 const h=role==='husband'?i:other,w=role==='wife'?i:other;
 document.getElementById('husbandAns').textContent=String.fromCharCode(65+h)+'｜'+q.opts[h];
 document.getElementById('wifeAns').textContent=String.fromCharCode(65+w)+'｜'+q.opts[w];
 document.getElementById('syncReveal').classList.remove('hidden');
 if(h===w){syncScore++;document.getElementById('syncStatus').textContent='✅ 一樣！+1 分';}else document.getElementById('syncStatus').textContent='😆 不一樣，這題 0 分';
 document.getElementById('syncScore').textContent=syncScore;document.getElementById('syncNext').classList.remove('hidden');
}
document.getElementById('syncNext').onclick=()=>{
 if(syncIndex===syncQuestions.length-1){
  document.getElementById('stage1').classList.add('hidden');document.getElementById('stage1End').classList.remove('hidden');
  document.getElementById('finalSyncScore').textContent=syncScore;document.getElementById('lifelinesEarned').textContent=syncScore;
 } else {syncIndex++;renderSync();}
};

const prizes=[500,1000,2000,4000,8000,15000];
const moneyQuestions=[
{q:'如果你們突然多出一天完整假期，最可能一起選哪個？',opts:['在家耍廢','吃一頓超好的','開車出去晃','各做各的事'],correct:2},
{q:'兩個人一起吃完超飽的大餐後，最可能做什麼？',opts:['再找甜點','說明天要減肥','回家躺平','去唱歌'],correct:2},
{q:'如果紀念日只能保留一件事，你們最可能選？',opts:['交換禮物','一起吃大餐','安排旅行','待在家追劇'],correct:1},
{q:'如果一起打遊戲卡王，下一步最可能是？',opts:['查攻略','怪裝備','再打一次','直接睡覺'],correct:2},
{q:'如果突然中一筆不小的獎金，最可能先拿來？',opts:['買東西','存起來','旅行','吃大餐'],correct:2},
{q:'最後一關：最有可能讓你們兩個都覺得值得的是？',opts:['昂貴禮物','共同回憶','多睡一天','什麼都不做'],correct:1}
];
const deck=[
{name:'❤️ 愛的鼓勵',effect:'你們一定可以的！實際效果：沒有。',type:'junk'},
{name:'🧘 深呼吸卡',effect:'一起深呼吸三秒。然後繼續想。',type:'junk'},
{name:'👩 老婆直覺卡',effect:'提示：相信老婆。這算提示嗎？',type:'junk'},
{name:'🧠 老公分析卡',effect:'提示：再分析一次。完全沒有新資訊。',type:'junk'},
{name:'✨ 幸運閃光卡',effect:'畫面閃一下。就這樣。',type:'flash'},
{name:'🤏 微弱排除卡',effect:'隨機讓一個錯誤答案變淡。',type:'weak'},
{name:'✂️ 神級二選一卡',effect:'直接刪掉兩個錯誤答案。',type:'strong'}
];
let moneyIndex=0,currentMoney=0,locked=false,waitingRevive=false,removed=[],remaining=[];
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x}
document.getElementById('goStage2').onclick=()=>{
 document.getElementById('stage1End').classList.add('hidden');document.getElementById('stage2').classList.remove('hidden');
 remaining=shuffle(Array.from({length:syncScore},(_,i)=>i%deck.length));renderMoney();
};
function renderLadder(){ $('ladder').innerHTML='';prizes.forEach((p,i)=>{const r=document.createElement('div');r.className='step';if(i===moneyIndex&&!waitingRevive)r.classList.add('active');if(i<moneyIndex)r.classList.add('passed');r.innerHTML='<span>第 '+(i+1)+' 題</span><strong>$'+p.toLocaleString()+'</strong>';$('ladder').appendChild(r)})}
function renderBag(){ $('bag').innerHTML='';remaining.forEach((di,pos)=>{const b=document.createElement('button');b.className='cardback';b.textContent='🃏';b.disabled=waitingRevive||locked;b.onclick=()=>useCard(pos);$('bag').appendChild(b)});$('bagCount').textContent=remaining.length}
function useCard(pos){if(locked||waitingRevive)return;const c=deck[remaining.splice(pos,1)[0]];$('cardResult').classList.add('show');$('cardName').textContent=c.name;$('cardEffect').textContent=c.effect;renderBag();
 if(c.type==='weak'){const wrong=moneyQuestions[moneyIndex].opts.map((_,i)=>i).filter(i=>i!==moneyQuestions[moneyIndex].correct&&!removed.includes(i));if(wrong.length){const pick=wrong[Math.floor(Math.random()*wrong.length)];$('moneyOptions').children[pick].style.opacity='.45'}}
 if(c.type==='strong'){shuffle(moneyQuestions[moneyIndex].opts.map((_,i)=>i).filter(i=>i!==moneyQuestions[moneyIndex].correct)).slice(0,2).forEach(i=>{removed.push(i);const b=$('moneyOptions').children[i];b.disabled=true;b.style.opacity='.28';b.textContent+=' ✕'})}
 if(c.type==='flash')$('cardResult').animate([{opacity:.2},{opacity:1},{opacity:.3},{opacity:1}],{duration:600})
}
function renderMoney(){
 locked=false;waitingRevive=false;removed=[];const q=moneyQuestions[moneyIndex];
 $('qnum').textContent='第 '+(moneyIndex+1)+' 題 / '+moneyQuestions.length;$('questionMoney').textContent='本題價值 $'+prizes[moneyIndex].toLocaleString();$('moneyQuestion').textContent=q.q;$('currentMoney').textContent='$'+currentMoney.toLocaleString();$('feedback').textContent='你們可以直接作答，或放棄並帶走目前獎金。';$('nextMoneyBtn').disabled=true;$('nextMoneyBtn').textContent=moneyIndex===moneyQuestions.length-1?'看結算':'下一題';$('reviveBox').classList.remove('show');$('cardResult').classList.remove('show');$('moneyOptions').innerHTML='';
 q.opts.forEach((t,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'｜'+t;b.onclick=()=>answerMoney(i);$('moneyOptions').appendChild(b)});
 renderBag();renderLadder()
}
function answerMoney(i){if(locked||waitingRevive)return;const q=moneyQuestions[moneyIndex];[...$('moneyOptions').children].forEach(b=>b.disabled=true);
 if(i===q.correct){locked=true;currentMoney=prizes[moneyIndex];$('currentMoney').textContent='$'+currentMoney.toLocaleString();$('feedback').textContent='✅ 答對！獎金升到 $'+currentMoney.toLocaleString()+'！';$('nextMoneyBtn').disabled=false;renderLadder()}
 else{waitingRevive=true;$('feedback').textContent='❌ 答錯！要不要花 3 張錦囊復活？';$('reviveBox').classList.add('show');$('reviveBtn').disabled=remaining.length<3;$('reviveText').textContent=remaining.length>=3?'支付 🃏🃏🃏 三張錦囊，這題重新作答。':'只剩 '+remaining.length+' 張錦囊，不足 3 張，無法復活。';renderBag();renderLadder()}
}
$('reviveBtn').onclick=()=>{if(!waitingRevive||remaining.length<3)return;remaining.splice(0,3);waitingRevive=false;$('reviveBox').classList.remove('show');$('feedback').textContent='❤️‍🔥 復活成功！消耗 3 張錦囊，這題再來一次。';[...$('moneyOptions').children].forEach((b,i)=>b.disabled=removed.includes(i));renderBag();renderLadder()};
function finish(kind){$('stage2').classList.add('hidden');$('finalScreen').classList.remove('hidden');$('finalMoney').textContent='$'+currentMoney.toLocaleString();
 if(kind==='quit'){$('finalIcon').textContent='💼';$('finalTitle').textContent='安全下車';$('finalText').textContent='你們選擇放棄挑戰，帶走目前獎金。'}
 else if(kind==='win'){$('finalIcon').textContent='🏆';$('finalTitle').textContent='全破！';$('finalText').textContent='你們一路爬到最高獎金。'}
 else{$('finalIcon').textContent='💥';$('finalTitle').textContent='挑戰失敗';$('finalText').textContent='錦囊不足或選擇不復活，挑戰結束。'}}
$('failBtn').onclick=()=>finish('fail');$('quitBtn').onclick=()=>finish('quit');$('nextMoneyBtn').onclick=()=>{if(!locked)return;if(moneyIndex===moneyQuestions.length-1)finish('win');else{moneyIndex++;renderMoney()}};
</script>
</body>
</html>
