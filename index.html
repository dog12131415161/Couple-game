<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夫妻獎金闖關</title>
<style>
:root{--bg:#f6f1eb;--card:#fff;--text:#2b2723;--muted:#77706a;--accent:#d76a5c;--accent2:#f5d7d1;--border:#e7ddd5;--panel:#fbf7f4}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.title small{display:block;color:var(--muted)}.title h1{margin:4px 0 0;font-size:28px}.money{background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-weight:700}
.layout{display:grid;grid-template-columns:190px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.04)}
#ladder{display:flex;flex-direction:column-reverse;gap:8px}.step{border:1px solid var(--border);border-radius:12px;padding:9px 10px;display:flex;justify-content:space-between;font-size:14px}.step.active{outline:2px solid var(--accent);background:var(--accent2);font-weight:800}.step.passed{opacity:.55}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.badge{background:var(--panel);padding:6px 10px;border-radius:999px;color:var(--text);font-weight:700}
#question{font-size:24px;font-weight:800;line-height:1.45;margin:18px 0}#options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;cursor:pointer}.option{min-height:58px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:13px 14px;text-align:left;font-weight:700}.option:hover{background:var(--panel)}.option:disabled{cursor:not-allowed}
.feedback{margin-top:14px;min-height:48px;background:var(--panel);border-radius:14px;padding:13px;text-align:center;font-weight:700}
.section{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}.bag-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end}.bag-title{font-weight:800}.bag-sub{font-size:13px;color:var(--muted);margin-top:3px}
#bag{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.cardback{min-width:48px;min-height:58px;border:1px solid var(--border);border-radius:12px;background:var(--panel);font-size:23px}.card-result{display:none;margin-top:12px;background:var(--panel);border-radius:14px;padding:14px;text-align:center}.card-result.show{display:block}.card-name{font-weight:800;font-size:18px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.btn{min-height:44px;border-radius:12px;padding:10px 16px;font-weight:800;border:1px solid var(--border);background:#fff}.btn.primary{background:var(--accent2);border-color:transparent}.btn:disabled{opacity:.4;cursor:not-allowed}
.revive{display:none;background:#fff2ef;border:1px solid #efc4bc;border-radius:16px;padding:16px;text-align:center;margin-top:14px}.revive.show{display:block}.revive h3{margin:0 0 8px}
.end{display:none;text-align:center}.end.show{display:block}.end .big{font-size:52px;font-weight:900;margin:10px 0}
@media(max-width:720px){.layout{grid-template-columns:1fr}#options{grid-template-columns:1fr}.title h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="title"><small>第二階段</small><h1>🔥 夫妻獎金闖關</h1></div>
<div class="money">🧧 目前保有：<span id="currentMoney">$0</span></div>
</div>

<div class="layout" id="gameWrap">
<aside class="card">
<div style="font-weight:800">💰 獎金階梯</div>
<div style="font-size:12px;color:var(--muted);margin:4px 0 10px">答對一題就往上爬</div>
<div id="ladder"></div>
</aside>

<main class="card">
<div class="qhead"><span id="qnum"></span><span class="badge" id="questionMoney"></span></div>
<div id="question"></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>

<div class="revive" id="reviveBox">
<h3>💥 答錯了！</h3>
<div id="reviveText"></div>
<div class="actions">
<button class="btn primary" id="reviveBtn">支付 3 張錦囊復活 ❤️‍🔥</button>
<button class="btn" id="giveUpAfterFailBtn">不復活</button>
</div>
</div>

<div class="section">
<div class="bag-head">
<div><div class="bag-title">🎒 錦囊</div><div class="bag-sub">除了翻牌使用，也可以拿 3 張復活。</div></div>
<div><b>剩餘 <span id="bagCount"></span> 張</b></div>
</div>
<div id="bag"></div>
<div class="card-result" id="cardResult"><div class="card-name" id="cardName"></div><div id="cardEffect"></div></div>
</div>

<div class="actions">
<button class="btn" id="quitBtn">💼 放棄，拿走獎金</button>
<button class="btn primary" id="nextBtn" disabled>下一題</button>
</div>
</main>
</div>

<section class="card end" id="endCard">
<div id="endIcon" style="font-size:48px">🎉</div>
<h2 id="endTitle"></h2>
<div style="color:var(--muted)">你們最後帶走</div>
<div class="big" id="finalMoney">$0</div>
<div id="endText" style="color:var(--muted)"></div>
<div class="actions"><button class="btn primary" id="restartBtn">重新玩 Demo</button></div>
</section>
</div>

<script>
const prizes=[500,1000,2000,4000,8000,15000];
const questions=[
{q:'如果你們突然多出一天完整假期，最可能一起選哪個？',opts:['在家耍廢','吃一頓超好的','開車出去晃','各做各的事'],correct:2},
{q:'兩個人一起吃完超飽的大餐後，最可能做什麼？',opts:['再找甜點','說明天要減肥','回家躺平','去唱歌'],correct:2},
{q:'如果紀念日只能保留一件事，你們最可能選？',opts:['交換禮物','一起吃大餐','安排旅行','待在家追劇'],correct:1},
{q:'如果一起打遊戲卡王，下一步最可能是？',opts:['查攻略','怪裝備','再打一次','直接睡覺'],correct:2},
{q:'如果突然中一筆不小的獎金，最可能先拿來？',opts:['買東西','存起來','旅行','吃大餐'],correct:2},
{q:'最後一關：最有可能讓你們兩個都覺得值得的是？',opts:['昂貴禮物','共同回憶','多睡一天','什麼都不做'],correct:1}
];
const deck=[
{name:'❤️ 愛的鼓勵',effect:'你們一定可以的！實際效果：沒有。',type:'junk'},
{name:'🧘 深呼吸卡',effect:'一起深呼吸三秒。然後繼續想。',type:'junk'},
{name:'👩 老婆直覺卡',effect:'提示：相信老婆。這算提示嗎？',type:'junk'},
{name:'🧠 老公分析卡',effect:'提示：再分析一次。完全沒有新資訊。',type:'junk'},
{name:'✨ 幸運閃光卡',effect:'畫面閃一下。就這樣。',type:'flash'},
{name:'🤏 微弱排除卡',effect:'隨機讓一個錯誤答案變淡。',type:'weak'},
{name:'✂️ 神級二選一卡',effect:'直接刪掉兩個錯誤答案。',type:'strong'}
];
let index=0,currentMoney=0,locked=false,waitingRevive=false,removed=[],remaining=[];
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x}
function renderLadder(){ $('ladder').innerHTML=''; prizes.forEach((p,i)=>{const r=document.createElement('div');r.className='step';if(i===index&&!waitingRevive)r.classList.add('active');if(i<index)r.classList.add('passed');r.innerHTML='<span>第 '+(i+1)+' 題</span><strong>$'+p.toLocaleString()+'</strong>';$('ladder').appendChild(r)})}
function renderBag(){ $('bag').innerHTML=''; remaining.forEach((deckIndex,pos)=>{const b=document.createElement('button');b.className='cardback';b.textContent='🃏';b.disabled=waitingRevive||locked;b.onclick=()=>useCard(pos);$('bag').appendChild(b)});$('bagCount').textContent=remaining.length}
function useCard(pos){if(locked||waitingRevive)return;const c=deck[remaining.splice(pos,1)[0]];$('cardResult').classList.add('show');$('cardName').textContent=c.name;$('cardEffect').textContent=c.effect;renderBag();
if(c.type==='weak'){const wrong=questions[index].opts.map((_,i)=>i).filter(i=>i!==questions[index].correct&&!removed.includes(i));if(wrong.length){const pick=wrong[Math.floor(Math.random()*wrong.length)];$('options').children[pick].style.opacity='.45'}}
if(c.type==='strong'){shuffle(questions[index].opts.map((_,i)=>i).filter(i=>i!==questions[index].correct)).slice(0,2).forEach(i=>{removed.push(i);const b=$('options').children[i];b.disabled=true;b.style.opacity='.28';b.textContent+=' ✕'})}
if(c.type==='flash')$('cardResult').animate([{opacity:.2},{opacity:1},{opacity:.3},{opacity:1}],{duration:600})}
function renderQuestion(){locked=false;waitingRevive=false;removed=[];const q=questions[index];$('qnum').textContent='第 '+(index+1)+' 題 / '+questions.length;$('questionMoney').textContent='本題價值 $'+prizes[index].toLocaleString();$('question').textContent=q.q;$('currentMoney').textContent='$'+currentMoney.toLocaleString();$('feedback').textContent='你們可以直接作答，或現在放棄並帶走目前獎金。';$('nextBtn').disabled=true;$('nextBtn').textContent=index===questions.length-1?'看結算':'下一題';$('reviveBox').classList.remove('show');$('cardResult').classList.remove('show');$('options').innerHTML='';
q.opts.forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'｜'+t;b.onclick=()=>answer(i);$('options').appendChild(b)});renderBag();renderLadder()}
function answer(i){if(locked||waitingRevive)return;const q=questions[index];[...$('options').children].forEach(b=>b.disabled=true);if(i===q.correct){locked=true;currentMoney=prizes[index];$('currentMoney').textContent='$'+currentMoney.toLocaleString();$('feedback').textContent='✅ 答對！獎金升到 $'+currentMoney.toLocaleString()+'！';$('nextBtn').disabled=false;renderLadder()}else{waitingRevive=true;$('feedback').textContent='❌ 答錯！要不要花 3 張錦囊復活？';$('reviveBox').classList.add('show');$('reviveBtn').disabled=remaining.length<3;$('reviveText').textContent=remaining.length>=3?'支付 🃏🃏🃏 三張錦囊，這題重新作答。':'只剩 '+remaining.length+' 張錦囊，不足 3 張，無法復活。';renderBag();renderLadder()}}
function revive(){if(!waitingRevive||remaining.length<3)return;remaining.splice(0,3);waitingRevive=false;$('reviveBox').classList.remove('show');$('feedback').textContent='❤️‍🔥 復活成功！消耗 3 張錦囊，這題再來一次。';[...$('options').children].forEach((b,i)=>b.disabled=removed.includes(i));renderBag();renderLadder()}
function finish(kind){$('gameWrap').style.display='none';$('endCard').classList.add('show');$('finalMoney').textContent='$'+currentMoney.toLocaleString();if(kind==='quit'){$('endIcon').textContent='💼';$('endTitle').textContent='安全下車';$('endText').textContent='你們選擇放棄挑戰，帶走目前獎金。'}else if(kind==='win'){$('endIcon').textContent='🏆';$('endTitle').textContent='全破！';$('endText').textContent='你們一路爬到最高獎金。'}else{$('endIcon').textContent='💥';$('endTitle').textContent='挑戰失敗';$('endText').textContent='錦囊不足或選擇不復活，挑戰結束。'}}
$('reviveBtn').onclick=revive;$('giveUpAfterFailBtn').onclick=()=>finish('fail');$('quitBtn').onclick=()=>finish('quit');$('nextBtn').onclick=()=>{if(!locked)return;if(index===questions.length-1)finish('win');else{index++;renderQuestion()}};
$('restartBtn').onclick=()=>{index=0;currentMoney=0;locked=false;waitingRevive=false;removed=[];remaining=shuffle(deck.map((_,i)=>i));$('endCard').classList.remove('show');$('gameWrap').style.display='grid';renderQuestion()};
remaining=shuffle(deck.map((_,i)=>i));renderQuestion();
</script>
</body>
</html>
